name: Prepare Builder
description: 'Prepare Build Environment'
inputs:
  rust-version:
    description: 'version of rust to install (e.g. nightly)'
    required: true
    default: 'stable'
  jdk-version:
    description: 'jdk version to install (e.g., 17)'
    required: true
    default: '17'
  jdk-distribution:
    description: "JDK distribution; target qualification uses Eclipse Temurin"
    default: "zulu"
runs:
  using: "composite"
  steps:
    - name: Install Build Dependencies
      shell: bash
      run: |
        apt-get update
        apt-get install -y protobuf-compiler
        apt-get install -y clang

    - name: Install JDK ${{inputs.jdk-version}}
      uses: actions/setup-java@v4
      with:
        # Preserve the existing distribution for compatibility rows; production
        # Spark4.2 explicitly selects the pinned Eclipse Temurin build.
        distribution: ${{ inputs.jdk-distribution }}
        java-version: ${{inputs.jdk-version}}

    - name: Verify pinned Temurin qualification runtime
      if: ${{ startsWith(inputs.jdk-version, '25.') }}
      shell: bash
      run: python3 -B dev/ci/java-runtime.py --github-env "$GITHUB_ENV"

    - name: Set JAVA_HOME
      shell: bash
      run: echo "JAVA_HOME=$(echo ${JAVA_HOME})" >> $GITHUB_ENV

    - name: Setup Rust toolchain
      shell: bash
      # rustfmt is needed for the substrait build script
      run: |
        echo "Installing ${{inputs.rust-version}}"
        rustup toolchain install ${{inputs.rust-version}}
        rustup default ${{inputs.rust-version}}
        rustup component add rustfmt clippy

    # Runs last so the JDK is on PATH. Retries the Maven distribution download
    # and caches it; see .github/actions/maven-bootstrap/action.yaml.
    - name: Bootstrap Maven
      uses: ./.github/actions/maven-bootstrap
