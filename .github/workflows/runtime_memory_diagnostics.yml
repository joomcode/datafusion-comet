name: Runtime Memory Diagnostics

on:
  push:
    branches: [joom/1.2-runtime-memory-diagnostic]
    paths:
      - .github/workflows/runtime_memory_diagnostics.yml
      - dev/ci/runtime-memory-diagnostic.py
      - dev/ci/SparkParquetMemoryProbe.java

permissions:
  contents: read

jobs:
  diagnose:
    name: Official Spark 4.2.1 Parquet ownership
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      JAVA_TOOL_OPTIONS: >-
        --add-exports=java.base/sun.nio.ch=ALL-UNNAMED
        --add-opens=java.base/java.nio=ALL-UNNAMED
        --add-opens=java.base/java.lang=ALL-UNNAMED
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Diagnose unchanged official Spark Parquet ownership
        shell: bash
        run: |
          set -euo pipefail
          python3 dev/ci/runtime-memory-diagnostic.py \
            --output "$PWD/target/parquet-memory-probe"

      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spark-parquet-memory-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/parquet-memory-probe/
          if-no-files-found: error
          retention-days: 7
